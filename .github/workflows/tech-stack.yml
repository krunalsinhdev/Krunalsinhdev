name: Neon Tech Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generate_tech_stack.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate tech stack SVG
        run: python generate_tech_stack.py neon-tech-stack.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neon-tech-stack.svg
          git diff --staged --quiet || git commit -m "chore: update neon tech stack"
          git push
