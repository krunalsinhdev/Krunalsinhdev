name: Generate Focus Areas

on:
  workflow_dispatch:
  push:
    paths:
      - generate_focus_areas.py
      - .github/workflows/focus-areas.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVG
        run: python generate_focus_areas.py

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add focus-areas.svg
          git diff --cached --quiet || git commit -m "chore: update focus areas chart"
          git push
